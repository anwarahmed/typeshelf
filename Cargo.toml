[package]
name = "typeshelf"
version = "0.2.0"
edition = "2024"
# Oldest toolchain that builds this; the `msrv` CI job keeps it true.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/anwarahmed/typeshelf"
description = "Practice typing in the terminal by retyping classic books"
readme = "README.md"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
unicode-normalization = "0.1.25"
unicode-width = "0.2.2"
ureq = "3.4.2"

[profile.release]
lto = true
# Keep symbol names so a panic logged in the field has a readable backtrace.
strip = "debuginfo"
